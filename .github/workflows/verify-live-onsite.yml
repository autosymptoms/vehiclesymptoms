name: Verify live visitor links and media
on:
  push:
    branches: [qa/onsite-public-playback]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Check generated email guide data
        run: test "$(git hash-object api/_data/journeys.json)" = 5b506c1ce01ba198390cf420f428d716122866c1
      - run: node tools/regression.js
      - run: node tools/qa-production-media.cjs
